<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago seguro — De Cero a Comediante</title>
  <link rel="stylesheet" href="css/main.css?v=2" />
</head>
<body class="checkout-page">
  <nav class="navbar">
    <div class="nav-brand">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      De Cero a Comediante
    </div>
    <a href="index.html" class="btn btn-ghost btn-sm">
      <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver
    </a>
  </nav>

  <main class="checkout-layout">
    <div class="checkout-summary">
      <h1>Resumen de compra</h1>
      <div class="checkout-course-card">
        <div class="checkout-course-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
        </div>
        <div class="checkout-course-info">
          <h2 id="checkout-course-title">De Cero a Comediante</h2>
          <p>Curso completo · Acceso de por vida</p>
          <ul class="checkout-features">
            <li><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> +40 lecciones en video</li>
            <li><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Ejercicios prácticos</li>
            <li><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Actualizaciones gratuitas</li>
          </ul>
        </div>
      </div>
      <div class="checkout-total">
        <span>Total</span>
        <strong id="checkout-price">$199.000 COP</strong>
      </div>
      <p class="checkout-guarantee">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Pago 100% seguro · Garantía de 14 días
      </p>
    </div>

    <div class="checkout-payment">
      <div id="checkout-loading" class="checkout-loader">
        <div class="spinner"></div>
        <p>Preparando pago seguro...</p>
      </div>
      <div id="checkout-error" class="checkout-error hidden">
        <p id="checkout-error-msg"></p>
        <a href="login.html" class="btn btn-primary" id="checkout-login-link">Iniciar sesión</a>
      </div>
      <div id="wompi-container" class="hidden"></div>
    </div>
  </main>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/checkout.js?v=2"></script>
</body>
</html>
